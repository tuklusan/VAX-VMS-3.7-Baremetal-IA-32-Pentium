# Use this EXAMPLE only after the future VMS 3.7 port has an NE2000 driver and a DECnet stack.
# Copy these settings into dosbox-x.conf, replacing the [ne2000] section.
# PCAP needs the appropriate host capture libraries, permissions and NIC.
# The selected interface generally must be wired Ethernet, not Wi-Fi.

[ne2000]
ne2000 = true
nicbase = 300
nicirq = 10
macaddr = AC:DE:48:11:22:33
backend = pcap

[ethernet, pcap]
# Replace 'list' with an actual interface name/index after discovery.
realnic = list
