# DOSBox-X: native 32-bit x86 bare-metal VMS 3.7 PORT RESEARCH (not VAX/VMS).
# Deliberately selects the highest documented normal CPU class: Pentium III.
# 1024MB is a practical bring-up setting, NOT DOSBox-X's theoretical RAM cap.
# Run from this directory: dosbox-x -conf dosbox-x.conf

[dosbox]
machine = svga_s3
memsize = 1024

[cpu]
core = dynamic
cputype = pentium_iii
cycles = max
fpu = true

[render]
aspect = true

[ide, primary]
enable = true

[fdc, primary]
enable = true

[ne2000]
ne2000 = true
nicbase = 300
nicirq = 10
# This provides an NE2000 virtual NIC, but SLIRP cannot carry Phase IV.
# SLIRP is useful for future IP testing but cannot carry DECnet Phase IV
# native Layer-2 traffic. For that use pcap/raw Ethernet and a wired NIC.
backend = slirp

[serial]
# DOSBox-X captures guest native COM1 diagnostics to this local text file.
serial1 = file file:portlab-serial.log timeout:1000

[autoexec]
# Raw diagnostics disk, attached to physical IDE primary/master.
imgmount 2 portdisk.img -t hdd -fs none -size 512,63,16,8 -ide 1m
boot vms37lab.ima
